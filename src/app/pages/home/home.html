<div class="home-hero">
  <div class="hero-text">
    <h1>Organize suas tarefas de forma simples e poderosa</h1>
    <p>
      Tenha mais produtivadade e clareza no seu dia-a-dia com o nosso Agendador de Tarefas
      inteligente
    </p>
    <div class="hero-actions">
      <button mat-raised-button routerLink="/register">Comece Agora</button>
      <button mat-raised-button routerLink="/login">Já possuo cadastro</button>
    </div>
  </div>
  <div class="hero-image">
    <img [src]="imgHero" />
  </div>
</div>
