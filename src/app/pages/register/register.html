<div class="register-component">
  <form [formGroup]="form">
    <mat-card class="example-card" appearance="outlined">
      <mat-card-header class="padding-m">
        <mat-card-title>Cadastro de Usuário</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field class="full-width">
          <mat-label>Nome Completo</mat-label>
          <input matInput formControlName="nome" placeholder="Digite seu Nome Completo" />
          @if (fullNameErros) {
            <mat-error>{{ fullNameErros }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="Digite seu Email" />
          @if (emailErros) {
            <mat-error>{{ emailErros }}</mat-error>
          }
        </mat-form-field>

        <input-password-field
          [placeholder]="'Cadastre a sua senha'"
          [control]="passwordControl"
          class="full-width"
        ></input-password-field>
      </mat-card-content>
      <mat-card-actions>
        <button
          matButton="outlined"
          class="full-width"
          (click)="submit()"
          [disabled]="form.invalid || isLoading"
        >
          <span class="cad-button-content">
            {{ isLoading ? 'Cadastrando...' : 'Cadastrar' }}
            @if (isLoading) {
              <mat-spinner diameter="20"></mat-spinner>
            }
          </span>
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
