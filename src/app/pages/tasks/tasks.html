<section class="tasks-component">
  @if (!hasTasks()) {
    <mat-card class="tasks-card" appearance="outlined">
      <mat-card-content class="tasks-content">
        <h2>Minhas Tarefas</h2>
        <p>
          Você ainda não possui tarefa alguma cadastrada. <br />
          Comece criando a sua primeira Tarefa!
        </p>
        <button mat-flat-button (click)="cadastrarTarefa()">
          + Cadastrar minha primeira Tarefa 📑
        </button>
      </mat-card-content>
    </mat-card>
  } @else {
    <mat-accordion class="tasks-accordion full-width">
      @for (task of tasks(); track task.id) {
        <mat-expansion-panel
          (opened)="panelOpenState.set(true)"
          (closed)="panelOpenState.set(false)"
        >
          <mat-expansion-panel-header>
            <mat-panel-title> {{ task.nomeTarefa }} </mat-panel-title>
            <mat-panel-description>
              {{ task.dataEvento }}
            </mat-panel-description>
            <button matIconButton class="task-action-button" matSuffix (click)="editarTarefa(task)">
              <mat-icon> edit </mat-icon>
            </button>
            <button
              matIconButton
              class="task-action-button"
              matSuffix
              (click)="deletarTarefa(task)"
            >
              <mat-icon> delete </mat-icon>
            </button>
          </mat-expansion-panel-header>
          <p>{{ task.descricao }}</p>
        </mat-expansion-panel>
      }
    </mat-accordion>
    <button mat-flat-button (click)="cadastrarTarefa()">+ Adcionar Tarefa 📑</button>
  }
</section>
