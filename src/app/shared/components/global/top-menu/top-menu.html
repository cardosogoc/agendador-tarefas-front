<mat-toolbar class="app-top-menu-toolbar">
  <a class="logo" routerLink="/">
    <img [src]="appLogo" alt="Agendador de Tarefas" class="logo-img" />
  </a>

  <span class="spacer"></span>

  @if (!estaLogado) {
    <nav class="menu-acoes">
      <button
        matButton
        class="link-button"
        [disabled]="estaNaRotaLogin()"
        routerLink="/login"
      >
        Entrar
      </button>
      <button
        matButton="filled"
        class="cta-button"
        [disabled]="estaNaRotaRegister()"
        routerLink="/register"
      >
        Cadastrar-se
      </button>
    </nav>
  } @else {
    <nav class="menu-acoes">
      <a class="nav-link" routerLink="/tasks" routerLinkActive="ativo">Minhas tarefas</a>
      <button
        type="button"
        class="avatar-button"
        [matMenuTriggerFor]="menu"
        aria-label="Menu do usuário"
      >
        <span class="user-avatar">{{ pegarInicialUsuario() }}</span>
      </button>
    </nav>

    <mat-menu #menu="matMenu" xPosition="before">
      <button mat-menu-item routerLink="/user-data">
        <mat-icon>person</mat-icon>
        <span>Perfil</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
